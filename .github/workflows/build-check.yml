name: Build Check

on:
  pull_request:
    paths:
      - "app/**"
      - "infra/**"
      - ".github/workflows/build-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build app
        run: dotnet build app/UsecaseCoach.Mcp.csproj -c Release

      - name: Validate Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep
