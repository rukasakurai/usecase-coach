name: E2E Test

# Manual-only for now. The container app pulls its image via a managed identity
# whose AcrPull role assignment is created during `azd provision`, which requires
# the deployment principal to have Microsoft.Authorization/roleAssignments/write
# (Role Based Access Control Administrator / User Access Administrator). Until the
# CI principal is granted that, run this workflow manually after deploying. PRs are
# still validated by the credential-free Build Check workflow.
on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Run azd down after tests"
        required: false
        type: boolean
        default: true
      environment:
        description: "azd environment name"
        required: false
        type: string
      location:
        description: "Azure region"
        required: false
        type: string
        default: "japaneast"

permissions:
  id-token: write
  contents: read

env:
  AZD_ENVIRONMENT: ${{ inputs.environment || format('gha-e2e-{0}-{1}', github.run_id, github.run_attempt) }}
  AZD_LOCATION: ${{ inputs.location || 'japaneast' }}

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate azd with federated credential
        run: azd auth login --client-id "${{ vars.AZURE_CLIENT_ID }}" --federated-credential-provider github --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Initialize azd environment
        run: |
          azd env new "$AZD_ENVIRONMENT" || true
          azd env select "$AZD_ENVIRONMENT"
          azd env set AZURE_LOCATION "$AZD_LOCATION"
          azd env set AZURE_SUBSCRIPTION_ID "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_RESOURCE_GROUP "rg-$AZD_ENVIRONMENT"
          # CI's deploy identity cannot create Entra app registrations, so opt out of
          # the default Entra auth and deploy the endpoint unauthenticated.
          azd env set AUTH_DISABLED true

      - name: Create resource group
        run: |
          args=(-n "rg-$AZD_ENVIRONMENT" -l "$AZD_LOCATION")
          if [ -n "$RG_TAG_NAME" ]; then
            args+=(--tags "$RG_TAG_NAME=$RG_TAG_VALUE")
          fi
          az group create "${args[@]}"
        env:
          RG_TAG_NAME: ${{ secrets.RG_TAG_NAME }}
          RG_TAG_VALUE: ${{ secrets.RG_TAG_VALUE }}

      - name: Provision infrastructure (azd provision)
        run: azd provision --no-prompt

      - name: Deploy application (azd deploy with retries)
        run: |
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "=== azd deploy attempt $i/$MAX_RETRIES ==="
            if azd deploy --no-prompt; then
              echo "azd deploy succeeded on attempt $i"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::azd deploy failed after $MAX_RETRIES attempts"
              exit 1
            fi
            WAIT=$((i * 30))
            echo "::warning::azd deploy failed (attempt $i/$MAX_RETRIES). Retrying in ${WAIT}s..."
            sleep "$WAIT"
          done

      - name: Smoke test deployed MCP server
        run: |
          set -uo pipefail
          URL=$(azd env get-value SERVICE_MCP_URI)
          echo "MCP server: $URL"
          MCP="$URL/mcp"
          ct='Content-Type: application/json'
          acc='Accept: application/json, text/event-stream'

          # Container Apps scales from zero; wait for the first replica to wake.
          ok=
          for i in $(seq 1 30); do
            if curl -fsS -m 10 "$URL/" >/dev/null 2>&1; then ok=1; echo "Health OK (attempt $i)"; break; fi
            echo "Waiting for app... ($i)"; sleep 5
          done
          if [ -z "$ok" ]; then echo "::error::App did not become healthy"; exit 1; fi

          # initialize -> capture session id
          hdrs=$(mktemp)
          curl -fsS -D "$hdrs" -o /tmp/init.txt -m 30 -X POST "$MCP" -H "$ct" -H "$acc" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"e2e","version":"1"}}}'
          sid=$(grep -i '^mcp-session-id:' "$hdrs" | awk '{print $2}' | tr -d '\r' || true)
          if [ -z "$sid" ]; then echo "::error::no MCP session id"; cat /tmp/init.txt; exit 1; fi

          curl -fsS -m 30 -X POST "$MCP" -H "$ct" -H "$acc" -H "Mcp-Session-Id: $sid" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' -o /dev/null

          # tools/list -> tool is registered
          curl -fsS -m 30 -X POST "$MCP" -H "$ct" -H "$acc" -H "Mcp-Session-Id: $sid" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' -o /tmp/list.txt
          if ! grep -q 'get_reference_usecases' /tmp/list.txt; then echo "::error::tool not listed"; cat /tmp/list.txt; exit 1; fi

          # tools/call -> validate the response matches the repo's reference data
          curl -fsS -m 30 -X POST "$MCP" -H "$ct" -H "$acc" -H "Mcp-Session-Id: $sid" \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_reference_usecases","arguments":{}}}' -o /tmp/call.txt
          python3 scripts/verify_mcp_response.py --response /tmp/call.txt --data-dir data/reference-usecases

      - name: Cleanup (azd down)
        if: always() && inputs.cleanup != false
        run: azd down --no-prompt --force --purge
